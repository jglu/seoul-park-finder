<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Naver Map test</title>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=0t1sd32b2o"></script>
</head>
<body>
  <div id="map" style="width:100%;height:400px;"></div>
  <script>
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.5666805, 126.9784147), // Seoul City Hall
      zoom: 15
    });
    new naver.maps.Marker({
      position: new naver.maps.LatLng(37.5666805, 126.9784147),
      map: map
    });
  </script>
</body>
</html>
